plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yusaa.gununkelimesi'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yusaa.gununkelimesi'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        stable {
            storeFile file('keystore.p12')
            storeType 'pkcs12'
            storePassword System.getenv('GK_KEYSTORE_PASS')
            keyAlias '1'
            keyPassword System.getenv('GK_KEYSTORE_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
}
